<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Shield — Access Restricted</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');

    :root {
      --bg:          #000000;
      --surface:     #070707;
      --surface-2:   #0f0f0f;
      --border:      #1e1e1e;
      --border-hi:   #2e2e2e;
      --text:        #ffffff;
      --text-muted:  #787878;
      --danger:      #ff4d4d;
      --font-body:   'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-head:   'Space Grotesk', sans-serif;
      --font-serif:  'Instrument Serif', Georgia, serif;
      --font-mono:   'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle architectural dot matrix background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#1f1f1f 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.45;
      pointer-events: none;
    }

    /* Soft ambient top spotlight */
    body::after {
      content: '';
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 360px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 20px;
      padding: 44px 48px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.35), 0 0 60px rgba(255, 255, 255, 0.12), inset 0 0 15px rgba(255, 255, 255, 0.05);
      animation: cardEnter .45s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      padding: 5px 13px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 22px;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    h1 {
      font-family: var(--font-head);
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -1.2px;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    h1 em {
      font-family: var(--font-serif);
      font-weight: 400;
      font-style: italic;
      font-size: 40px;
      color: #d4d4d4;
      letter-spacing: -0.4px;
    }

    .blocked-domain-wrap {
      margin: 18px 0 22px;
    }

    .blocked-domain {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 77, 77, 0.08);
      border: 1px solid rgba(255, 77, 77, 0.25);
      color: var(--danger);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
      word-break: break-all;
    }

    .description {
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 400;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    /* Quote Card */
    .quote {
      position: relative;
      padding: 18px 20px;
      text-align: left;
      background: var(--surface-2);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-left: 3px solid #ffffff;
      border-radius: 6px 12px 12px 6px;
      margin-bottom: 30px;
      box-shadow: 0 0 14px rgba(255, 255, 255, 0.1);
    }

    #quoteText {
      display: block;
      font-family: var(--font-serif);
      font-size: 21px;
      font-style: italic;
      color: var(--text);
      line-height: 1.35;
      letter-spacing: 0.2px;
    }

    .quote-author {
      display: block;
      margin-top: 8px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: 10px;
      padding: 13px 28px;
      font-family: var(--font-head);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all .2s ease;
      letter-spacing: -0.2px;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.5), 0 0 35px rgba(255, 255, 255, 0.2);
    }

    .btn-back:hover {
      background: #f0f0f0;
      transform: translateY(-1px);
      box-shadow: 0 0 22px rgba(255, 255, 255, 0.8), 0 0 45px rgba(255, 255, 255, 0.4);
    }

    .btn-back:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 22px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: #444444;
      text-transform: uppercase;
      letter-spacing: 1.4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-pill">
      <span class="status-dot"></span>
      <span>Focus Shield Active</span>
    </div>

    <h1>Stay <em>Locked In</em></h1>

    <div class="blocked-domain-wrap">
      <div class="blocked-domain" id="blockedDomain">restricted site</div>
    </div>

    <p class="description">
      Access to this destination is currently blocked.<br>
      Protect your attention — your future self will thank you.
    </p>

    <div class="quote" id="quoteBox">
      <span id="quoteText">"Don't give up, God is with you."</span>
      <span class="quote-author" id="quoteAuthor">— Jeswin</span>
    </div>

    <button id="goBackBtn" class="btn-back">✕ Close Tab</button>

    <div class="footer-note">Focus Shield · Pure Black Edition</div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
